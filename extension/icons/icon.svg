<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="23" ry="23" fill="#6ea8fe"/>
  <!-- Bold serif lowercase 'n', sitting low in the square for graphic imbalance.
       Source font is Georgia (with Times New Roman / generic serif fallback).
       Before shipping we convert this <text> to an outline path so the SVG is
       font-independent. -->
  <text x="64" y="124" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="110" font-weight="700"
        fill="#0f1115">n</text>
</svg>
