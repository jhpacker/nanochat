<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NanoChat icon preview</title>
<style>
  body { background: #0f1115; color: #e4e6eb; font-family: ui-sans-serif, system-ui, sans-serif; padding: 32px; margin: 0; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 24px; }
  h2 { font-size: 13px; font-weight: 500; color: #8a92a3; margin: 32px 0 12px; }
  .row { display: flex; align-items: flex-end; gap: 32px; padding: 16px; border-radius: 8px; }
  .row.light { background: #f5f5f5; }
  .row.dark { background: #1a1d24; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label { font-size: 11px; color: #8a92a3; }
  .light .label { color: #555; }
  img { image-rendering: -webkit-optimize-contrast; }
</style>
</head>
<body>
  <h1>NanoChat icon — preview</h1>

  <h2>On dark (Chrome toolbar / app contexts)</h2>
  <div class="row dark">
    <div class="item"><img src="icon.svg" width="16" height="16"><div class="label">16px</div></div>
    <div class="item"><img src="icon.svg" width="32" height="32"><div class="label">32px</div></div>
    <div class="item"><img src="icon.svg" width="48" height="48"><div class="label">48px</div></div>
    <div class="item"><img src="icon.svg" width="128" height="128"><div class="label">128px (CWS store)</div></div>
  </div>

  <h2>On light (Chrome Web Store grid)</h2>
  <div class="row light">
    <div class="item"><img src="icon.svg" width="16" height="16"><div class="label">16px</div></div>
    <div class="item"><img src="icon.svg" width="32" height="32"><div class="label">32px</div></div>
    <div class="item"><img src="icon.svg" width="48" height="48"><div class="label">48px</div></div>
    <div class="item"><img src="icon.svg" width="128" height="128"><div class="label">128px (CWS store)</div></div>
  </div>

  <h2>Large (440×280 promo tile crop check)</h2>
  <div class="row dark">
    <div class="item"><img src="icon.svg" width="256" height="256"><div class="label">256px</div></div>
  </div>
</body>
</html>
